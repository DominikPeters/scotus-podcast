name: Build podcast
on:
  schedule:
    - cron: '8 13-23,0-3 * * 1-5'
  push:
    branches:
      - master
  repository_dispatch:
    types: [scotus_alignment_ready]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect alignment exports without changing episodes
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: podcast-publish
  cancel-in-progress: false
jobs:
  build_podcast:
    runs-on: ubuntu-latest
    env:
      SCOTUS_DRY_RUN: ${{ vars.SCOTUS_BRIDGE_DRY_RUN == 'true' || inputs.dry_run == true || github.event.client_payload.dry_run == true }}
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Install apt packages (sox, libsox-fmt-mp3)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: sox libsox-fmt-mp3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install pip and npm dependencies
        run: |
          pip install -r requirements.txt
          npm install
      - name: Check integration
        run: python3 -m unittest discover -p "test_*.py"
      - name: Run script
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          : > commit_message.txt
          if [[ "$SCOTUS_DRY_RUN" == "true" ]]; then
            python3 get_alignment.py --dry-run
          else
            python3 podcast.py
          fi
      - name: Commit and push if there are changes
        if: env.SCOTUS_DRY_RUN != 'true'
        run: |
          COMMIT_MESSAGE_FILE="commit_message.txt"
          git add data/case_data.json data/podcast.rss data/podcast_spotify.rss
          if ! git diff --cached --quiet; then
              # If not empty, get content and commit
              COMMIT_MESSAGE=$(<"$COMMIT_MESSAGE_FILE")
              COMMIT_MESSAGE=${COMMIT_MESSAGE:-Update podcast}
              git config --global user.email "actions@github.com"
              git config --global user.name "GitHub Action"
              git add data/case_data.json
              git add data/podcast.rss
              git add data/podcast_spotify.rss
              git commit -m "$COMMIT_MESSAGE"
              git push
          fi
